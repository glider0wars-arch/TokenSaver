[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "toknix"
version = "0.4.0"
description = "Conservative local prompt compression and rolling context memory utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
toknix = "tokensaver.cli:main"
tokensaver = "tokensaver.cli:main"

[tool.setuptools.packages.find]
include = ["tokensaver*"]
