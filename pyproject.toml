[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "toknix"
version = "0.4.0"
description = "Toknix: conservative prompt, tool-output, and context optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
toknix = "toknix.cli:main"
tokensaver = "tokensaver.cli:main"

[tool.setuptools.packages.find]
include = ["toknix*", "tokensaver*"]
