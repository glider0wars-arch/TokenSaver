[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensaver-local"
version = "0.3.0"
description = "Conservative local prompt compression and rolling context memory utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tokensaver = "tokensaver.cli:main"

[tool.setuptools.packages.find]
include = ["tokensaver*"]
