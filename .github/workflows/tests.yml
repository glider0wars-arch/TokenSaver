name: tests

on:
  push:
    branches: [main, feat/benchmark-and-tool-output-pr2]
  pull_request:
    branches: [main, fix/review-bugs]

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline retention and cost benchmark
        run: python -m benchmarks.run
